name: Release

# Pushing a tag like v0.1.0 builds binaries for each platform and attaches
# them to a GitHub release. Archive names follow the convention that
# cargo-binstall looks for, so `cargo binstall gitenv` works too.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          name=gitenv-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/gitenv README.md LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
      - uses: softprops/action-gh-release@v2
        with:
          files: gitenv-${{ matrix.target }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
